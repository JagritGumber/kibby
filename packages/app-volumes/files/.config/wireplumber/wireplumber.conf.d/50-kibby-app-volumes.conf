# Kibby: each app's remembered volume survives the app's own volume as it
# opens a stream, resumes or changes track. The script is
# ~/.local/share/wireplumber/scripts/kibby/app-volume-guard.lua.
wireplumber.components = [
  {
    name = kibby/app-volume-guard.lua, type = script/lua
    provides = kibby.app-volume-guard
    wants = [ hooks.stream.state ]
  }
]

# KIBBY_APP_VOLUME_GUARD in ~/.config/kibby/settings.env: required loads the
# guard (an optional feature that nothing else wants is never loaded), disabled
# leaves it out. Takes effect when WirePlumber next starts.
wireplumber.profiles = {
  main = {
    kibby.app-volume-guard = {{KIBBY_APP_VOLUME_GUARD}}
  }
}
