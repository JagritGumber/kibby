# Kibby: each app's remembered volume survives the app's own volume at start
# (Spotify sets its own 100 % on every track). The script is
# ~/.local/share/wireplumber/scripts/kibby/app-volume-guard.lua.
wireplumber.components = [
  {
    name = kibby/app-volume-guard.lua, type = script/lua
    provides = kibby.app-volume-guard
    wants = [ hooks.stream.state ]
  }
]

wireplumber.profiles = {
  main = {
    # required: an optional feature that nothing else wants is never loaded.
    kibby.app-volume-guard = required
  }
}
