background_opacity          0.6
cursor_trail                1
window_padding_width        25

# Codex hard-reserves Ctrl+Z for suspension; send its interrupt key instead so
# a session cannot remain stopped while holding the active-writer lock.
map ctrl+z send_key ctrl+c

# A generated colour theme, when one exists (globinclude skips it when absent).
globinclude {{HOME}}/.local/state/quickshell/kibby/user/generated/terminal/kitty-theme.conf
