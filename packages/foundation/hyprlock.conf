general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    color = rgb(121315)
}

label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = rgb(e5e2e6)
    font_size = 64
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 58
    position = 0, -40
    halign = center
    valign = center
    outline_thickness = 2
    outer_color = rgb(c8c4ee)
    inner_color = rgb(1b1b1f)
    font_color = rgb(e5e2e6)
    fade_on_empty = false
    placeholder_text = Password
}
