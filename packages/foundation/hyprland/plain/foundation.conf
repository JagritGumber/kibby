# Generated from user-owned Kibby foundation source.

unbind = SUPER, Return
bind = SUPER, Return, exec, {{terminal}}
unbind = SUPER, Space
bind = SUPER, Space, exec, {{launcher}}
unbind = SUPER, L
bind = SUPER, L, exec, {{lock}} -c {{hyprlock_config}}
unbind = SUPER CTRL, Return
bind = SUPER CTRL, Return, exec, {{terminal}} -e sh -lc 'kibby doctor; exec "${SHELL:-/bin/sh}"'

unbind = , XF86AudioRaiseVolume
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ {{volume_step}}%+ -l 1.0
unbind = , XF86AudioLowerVolume
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ {{volume_step}}%-
unbind = , XF86AudioMute
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
unbind = , XF86AudioMicMute
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

unbind = , XF86MonBrightnessUp
bindel = , XF86MonBrightnessUp, exec, brightnessctl set {{brightness_step}}%+
unbind = , XF86MonBrightnessDown
bindel = , XF86MonBrightnessDown, exec, brightnessctl set {{brightness_step}}%-

unbind = , Print
bind = , Print, exec, {{screenshot_region}}
unbind = SUPER, Print
bind = SUPER, Print, exec, {{screenshot_monitor}}
