# Typing devices pass through keyd unchanged, so they share keyd's single
# virtual keyboard with the mouse buttons remapped in kibby-mouse-desktops.conf.
# One device means one Caps Lock state. Hyprland keeps a separate Caps Lock
# per keyboard, and a mouse key press used to switch to the mouse's state.
#
# Left out on purpose: Wispr Flow's and ydotool's typing devices (dictation
# must type exact text, whatever Caps Lock says) and the headset buttons.

[ids]
# KIBBY_KEYD_KEYBOARD_IDS: device IDs from `sudo keyd monitor`, or * for
# every keyboard. Kibby writes one per line.
{{KIBBY_KEYD_KEYBOARD_IDS}}

[global]
# No extra Ctrl taps when a modifier is tapped alone: behave like no keyd.
disable_modifier_guard = 1

[main]
# keyd's control, shift and meta layers always send the LEFT key, so Right
# Ctrl arrived as Left Ctrl and broke Wispr Flow's Right Ctrl push-to-talk.
# Keep the right-hand keys themselves. (Left keys and Right Alt/AltGr
# already pass through as they are.)
rightcontrol = rightcontrol
rightshift = rightshift
rightmeta = rightmeta
