$lock_cmd = pidof hyprlock || hyprlock

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = {{HOME}}/.local/bin/hypr-before-sleep
    after_sleep_cmd = [ -x {{HOME}}/.local/bin/helium-sleep-hook ] && {{HOME}}/.local/bin/helium-sleep-hook after
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = $lock_cmd
}

listener {
    timeout = 600
    on-timeout = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "disable" }))'
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "enable" }))'
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
