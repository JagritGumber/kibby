[general]
framerate = 60
autosens = 0
sensitivity = {{KIBBY_WISPR_CAVA_SENSITIVITY}}
bars = 12

[input]
method = pulse
source = @SOURCE@

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
channels = mono
mono_option = average
ascii_max_range = 1000

[smoothing]
noise_reduction = 20
monstercat = 0
waves = 0
