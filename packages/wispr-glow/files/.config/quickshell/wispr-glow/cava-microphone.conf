[general]
framerate = 60
autosens = 0
sensitivity = {{KIBBY_WISPR_CAVA_SENSITIVITY}}
bars = 12

[input]
method = pulse
source = @SOURCE@

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
channels = mono
mono_option = average
; Must equal cavaRange in WisprActivity.qml; Kibby's CI checks that they do.
ascii_max_range = 10000

[smoothing]
noise_reduction = 20
monstercat = 0
waves = 0
